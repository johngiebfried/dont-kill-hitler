<style>

  opacity: 0.07; z-index: 0; }

.card-phase-badge { display: inline-block; font-family: 'Oswald', sans-serif; font-size: 5pt; font-weight: 400; letter-spacing: 1.5px; color: #faf7f0; padding: 1.5px 6px; margin-top: 4px; border-radius: 1px; }

<script>
const DATA = {"_meta": {"title": "Don't Kill Hitler — Mission Dossiers", "version": "v3-print (March 2026, as approved by John Giebfried and printed for class on Mar 9, 2026)", "source": "claude.ai chat 'First rule of time travel game design', CARDS array of dkh_printable_cards.html", "note": "Canonical text. Do NOT silently edit. Fact-check flags live in 03_CARD_DECK.md; apply fixes only after John approves them.", "phases": {"1": {"name": "Childhood", "label": "Phase I · Childhood · 1848–1913", "color": "#6b4c2a"}, "2": {"name": "Young Adulthood", "label": "Phase II · Young Adulthood · 1907–1919", "color": "#1a4a6b"}, "3": {"name": "Rise to Power", "label": "Phase III · Rise to Power · 1919–1933", "color": "#2a5c3a"}, "4": {"name": "In Power", "label": "Phase IV · In Power · 1933–1945", "color": "#6b1a1a"}}}, "cards": [{"id": 1, "phase": 1, "op": "CRADLE", "variant": "Variant A · Direct Action", "mission": "You're the attending midwife in Braunau am Inn, April 20, 1889. Klara Hitler has lost three children already. The physician has stepped out. You have ninety seconds alone with the newborn. A fourth loss won't surprise anyone. No one will ever know.", "complication": "The subject has done nothing. He is twelve minutes old. You are acting on a briefing about a person who does not yet exist. Argue that a detailed enough prediction about someone's future overrides the fact of their present innocence — and explain who gave you the authority to make that call."}, {"id": 2, "phase": 1, "op": "CRADLE", "variant": "Variant B · Extraction", "mission": "You arrive in Braunau am Inn within the infant's first month. You have forged Austrian civil documents and a placement arranged in Vienna's Leopoldstadt — the city's heavily Jewish second district. Infant mortality in 1889 gives you plausible cover. The child grows up under a false name inside the community his ideology will later seek to destroy.", "complication": "You're placing a baby with a family who will love him without knowing what he might become. If the monster is innate rather than made, you've just delivered a future genocidal dictator into the heart of his primary target population. Argue that environment beats nature. Your entire mission rests on that claim."}, {"id": 3, "phase": 1, "op": "CRADLE", "variant": "Variant C · The Long Game", "mission": "You embed yourself in the Hitler household as a lodger, tutor, or family friend and raise Subject A yourself from earliest childhood. The machine is one way. This is not a visit. You will spend the next thirty years being kind to a child you know may become a monster, and you will never be able to tell anyone why you're there.", "complication": "No extraction. No debrief. You'll be roughly thirty when this begins and sixty when it ends. Argue that sustained human presence and genuine care overrides the psychology in your briefing — and then argue, convincingly, that you can actually do this. For thirty years. Without breaking. Without revealing yourself. Without, at any point, accidentally making things worse."}, {"id": 4, "phase": 1, "op": "REMOVE THE FATHER", "variant": "Leonding · 1895–1903", "mission": "Alois Hitler — customs official, domestic authoritarian, heavy drinker — dies naturally in 1903. Your mission is to move that date forward by five to eight years. He drinks at the same tavern every evening. He has documented health problems. You are sent back as a tavern keeper, lodger, or physician's assistant. Natural causes are achievable without direct action.", "complication": "Removing an abusive father from an 1890s Austrian household doesn't produce a stable childhood. It produces a grieving widow with dependent children and no income. Argue that the specific character of Alois's abuse — his contempt for Adolf's ambitions, his authoritarian control — was more formative than its absence would have been, and that an earlier death improves rather than complicates what follows."}, {"id": 5, "phase": 1, "op": "INOCULATION", "variant": "Leonding · January 1900", "mission": "Edmund Hitler — Subject A's five-year-old brother — dies of measles in February 1900. Some biographers identify this as the moment Adolf becomes cold, withdrawn, and closed to adult authority. You arrive in Leonding as a traveling physician in January 1900, carrying a measles vaccine sixty years ahead of schedule. Edmund is treatable. You treat him.", "complication": "You're using a dying child as a timeline instrument. You're not saving Edmund because Edmund matters — you're saving him for what his survival might do to his brother. Argue that this distinction doesn't disqualify the mission, and then argue the harder claim: that a living Edmund specifically produces a less isolated, less radicalized adult Adolf rather than just a man with a living brother and identical politics."}, {"id": 6, "phase": 1, "op": "SCHOOLMASTER", "variant": "Linz Realschule · 1901–1904", "mission": "Leopold Pötsch — Subject A's history teacher in Linz — is a passionate German nationalist whose lectures Hitler later credits as foundational to his entire worldview. He names Pötsch specifically in Mein Kampf. You arrive with forged teaching credentials and replace him. You teach history as an evidence-based discipline to a twelve-year-old boy whose worldview hasn't calcified yet.", "complication": "Adolf is a normal child when you arrive. You're betting that one teacher, over a few years, is the load-bearing element of his historical imagination — not merely the first in a long series of nationalist influences that would have reached him anyway through the press, the street politics, and the general ambient culture of pre-war Austrian German nationalism. Make that case."}, {"id": 7, "phase": 1, "op": "WITTGENSTEIN", "variant": "Linz · 1903–1904", "mission": "Ludwig Wittgenstein — future philosopher, currently a wealthy and insufferable teenager from a family of Jewish descent — attends the same Linz school as Subject A in 1903–04. You arrive with a cover identity and enough money to make Wittgenstein a proposition: tutor Subject A in mathematics and logic — subjects he's failing — and keep doing it long enough to matter. You are not Wittgenstein. You are the person who has to convince him.", "complication": "Wittgenstein was famously impatient and contemptuous of anyone he found intellectually beneath him. Subject A was failing his coursework and developing a deep hostility to academic authority. Argue that forcing a sustained relationship between these two specific people produces humanization rather than humiliation — and account for the moment, which is coming, when Wittgenstein loses his patience entirely."}, {"id": 8, "phase": 1, "op": "PAULSKIRCHE", "variant": "Frankfurt · April 1849", "mission": "The Frankfurt Parliament is offering the Prussian King Frederick William IV the crown of a unified, constitutional, parliamentary Germany. He's about to refuse it — famously calling it a \"crown from the gutter.\" You're a Prussian court advisor. He accepts. A liberal, federally-structured Germany is born forty years before Hitler's birth, without Prussian military dominance, without the Franco-Prussian War, without the nationalist culture a young Adolf Hitler absorbs in Linz.", "complication": "The Frankfurt Parliament debates the status of Poles and Czechs with considerable hostility, and while it formally guarantees Jewish civil equality, the political culture is another matter. You're not producing a tolerant Germany — you're producing a nationalist state run by lawyers instead of generals. Argue that this difference is enough to prevent what follows, and that a constitutional Germany born in 1849 isn't just Wilhelmine Germany with better manners."}, {"id": 9, "phase": 1, "op": "FLYING DUTCHMAN", "variant": "Dresden · May 1849", "mission": "Richard Wagner is manning barricades in the Dresden uprising of May 1849 when Prussian troops arrive and an arrest warrant is issued for treason. In real history, Franz Liszt helps him flee to Zurich. You're the Saxon police inspector processing the warrant. Liszt's intervention doesn't reach Wagner in time. Wagner is tried for treason and executed. He's 36. The Ring cycle, Tristan, Parsifal, and Bayreuth don't exist.", "complication": "Wagner's antisemitic views are already well-known in Dresden's revolutionary circles before you arrest him — the ideology survives him. What dies is the aesthetic apparatus he hasn't yet built: the total artwork, the mythological grandeur, the operatic scale that will make ethnic resentment feel cosmic and transcendent. Argue that Wagner transforming racial hatred into sublime art is what makes his influence on Hitler irreplaceable, and that German nationalism without Wagnerian aesthetics is categorically less dangerous."}, {"id": 10, "phase": 1, "op": "SCHICKLGRUBER", "variant": "Döllersheim · 1876", "mission": "In 1876, Alois Schicklgruber petitions to be legally recognized as the son of Johann Georg Hiedler — whose name becomes \"Hitler\" through clerical error or dialect shift. You are the civil registrar. The paperwork never reaches the district court. Alois Schicklgruber remains Alois Schicklgruber. His son, born April 20, 1889, is registered as Adolf Schicklgruber.", "complication": "\"Heil Schicklgruber\" does not have the same ring. This is not a trivial observation. Political identity is partly sonic, partly rhythmic, and partly dependent on a name functioning as a command, a salute, and a brand simultaneously. Argue the serious case — and try to keep a straight face while doing it — that nomenclature is a load-bearing element of political charisma, and that this entirely bureaucratic accident is enough to change the outcome."}, {"id": 11, "phase": 2, "op": "LUEGER", "variant": "Vienna · 1897", "mission": "Emperor Franz Joseph has blocked Karl Lueger's confirmation as Vienna's mayor four times. He thinks the man's antisemitic demagoguery is an embarrassment to the Habsburg project, and he's constitutionally entitled to keep blocking it. You're a senior Imperial Chancellery advisor in 1897. You give the Emperor the legal cover, the political precedent, and the personal backbone to refuse a fifth time. Lueger never governs Vienna.", "complication": "Hitler credits Lueger in Mein Kampf as one of two men who taught him how politics actually works — that antisemitism could be a governing program, not just a street resentment. But Vienna's antisemitic press, its pan-German clubs, and its street politics exist entirely independently of who is mayor. Argue that removing this specific model — antisemitism as successful, competent, popular governance — closes something in Subject A's political imagination permanently, rather than just making him learn the same lesson from the next Lueger."}, {"id": 12, "phase": 2, "op": "STILL LIFE", "variant": "Variant A · The Bribe · Vienna 1907", "mission": "October 1907. Subject A's Vienna Academy application is borderline — solid architectural compositions, weak figure work. You arrive the evening before the review with forged faculty credentials and a persuasive amount of cash for one sympathetic committee member. Subject A receives a conditional acceptance. He becomes a painter.", "complication": "He's already reading pan-German publications before his first application. Acceptance doesn't remove the ideology — it gives it a studio. Argue specifically what changes when a radicalized young man becomes a radicalized young painter rather than a radicalized failed one, and whether a career in art actually reduces the resentment or just gives it better-lit surroundings."}, {"id": 13, "phase": 2, "op": "STILL LIFE", "variant": "Variant B · The Ticket · Vienna 1907", "mission": "October 1907. The Academy committee has rejected Subject A. Before the letter is sent, you intercept it. You're a minor Habsburg cultural administrator with access to the outgoing mail. You replace the rejection with a different letter: the Academy regrets that his figure work falls below their Vienna standard, but his architectural compositions show real promise. Enclosed is a scholarship for illustration studies at the Academia de Bellas Artes in Buenos Aires — and a one-way steamship ticket departing Trieste in three weeks.", "complication": "You've just offered Adolf Hitler a free trip to Argentina. He's twenty years old, broke, living in a men's hostel, and has no particular attachment to Vienna beyond his failed ambitions. Argue that a man who moves to Buenos Aires in 1907 stays in Buenos Aires — that distance, novelty, and a working career are enough to keep him on the other side of the Atlantic when the war breaks out, when Munich radicalizes, and when everything else happens without him."}, {"id": 14, "phase": 2, "op": "STILL LIFE", "variant": "Variant C · The Patron · Vienna 1909", "mission": "It's 1909. Subject A has been rejected twice by the Academy and is selling small watercolors for pocket change. You arrive as a minor but genuine art patron: regular commissions, a network of working artists, enough money to cover his rent. You're giving him the career without the institution. He's twenty years old, broke, and living in a men's hostel. He will be receptive to anyone who takes his work seriously.", "complication": "You will spend years being genuinely kind to Adolf Hitler. You know what he may become. He does not. His worldview is already shaped by Schönerer, Lueger, and five years of Vienna's antisemitic press. Argue that economic stability and human regard overrides an ideology that is not hypothetical — it is already substantially formed — and explain why your patronage produces a quieter man rather than a better-funded one with identical beliefs."}, {"id": 15, "phase": 2, "op": "WRONG ARMY", "variant": "Munich · August 1914", "mission": "August 1914. Subject A — an Austrian citizen illegally resident in Munich — petitions to serve in the Bavarian Army. The Bavarian draft board approves it without checking his citizenship. You're the clerk processing the petition. You check. He's redirected to Austrian jurisdiction.", "complication": "Here's the problem: the Austrian military already examined Subject A in Salzburg in February 1914 and found him unfit for service. Routing him back to Austria likely means he doesn't serve at all — not that he serves differently. A man who sits out the war in Vienna while Germany bleeds for four years is not automatically less radicalized. Argue what actually changes between \"fought the wrong war\" and \"didn't fight at all\" — and whether either version produces someone who can't find an audience in Munich in 1919."}, {"id": 16, "phase": 2, "op": "SARAJEVO", "variant": "Bosnia · June 28, 1914", "mission": "June 28, 1914. You're on Archduke Franz Ferdinand's security detail in Sarajevo. The motorcade route puts the car directly in front of Gavrilo Princip at a distance of five feet. The route is changed. The wrong turn onto Franz Josef Street doesn't happen. Franz Ferdinand returns to Vienna alive. WWI doesn't start in July 1914.", "complication": "The alliance system is primed and looking for a trigger. The underlying tensions don't disappear because this particular Archduke survives this particular afternoon. Argue that Sarajevo — this assassination, this city, this specific symbolic weight — was the necessary trigger, and that a Europe where Franz Ferdinand lives in July 1914 navigates the whole summer without a war. Then account for July 1915."}, {"id": 17, "phase": 2, "op": "WERVIK", "variant": "Flanders · October 1918", "mission": "October 14, 1918. Subject A is gassed near Wervik, Belgium — temporarily blinded, evacuated to the military hospital at Pasewalk, and receives news of the Armistice in a state of acute psychological crisis. He later identifies this as the moment he decides to enter politics. You're his unit's supply quartermaster. His replacement gas kit is functional. You issue it. He finishes the war in the field and walks home in November 1918.", "complication": "Pasewalk is where Subject A's messianism crystallizes — the conviction that he was preserved by providence for a national purpose. Remove it and you remove that. But he walks back to Munich with the same ideology, the same resentments, and the same radicalized veteran community, minus one formative crisis. Argue that Pasewalk was the trigger for his political entry specifically — not just the backdrop — and that a man who walks home from the field becomes an embittered private citizen rather than a politician."}, {"id": 18, "phase": 2, "op": "GUTMANN", "variant": "Western Front · August 1918", "mission": "August 1918. Subject A is recommended for the Iron Cross First Class — unusual for an enlisted man — by Sergeant Hugo Gutmann, a Jewish NCO who considers it fully deserved. The recommendation runs through regimental commander Major von Tubeuf. You're an administrative officer reviewing the file at Tubeuf's desk. A procedural irregularity means it doesn't proceed.", "complication": "You're blocking a decoration that a Jewish sergeant genuinely believes is merited, for reasons he cannot know. You're also betting that the Iron Cross First Class — not the Second Class he already holds, not the Wound Badge — is specifically the credential that makes him a credible political figure in 1919 Munich. Argue why this particular decoration is load-bearing rather than merely notable, and why the irony of a Jewish NCO's recommendation launching an antisemitic career isn't just darkly funny, but actually matters."}, {"id": 19, "phase": 2, "op": "SCHLIEFFEN", "variant": "Western Front · August 1914", "mission": "The Schlieffen Plan requires a rapid German sweep through Belgium and France to end the war in six weeks. In August 1914, General von Moltke weakens the critical right wing, detaches forces early, and loses his nerve at key moments. France doesn't fall. You're a senior German staff officer. Moltke's modifications don't happen. The right wing holds. Paris is encircled by autumn.", "complication": "A Germany that wins WWI in 1914 draws exactly the wrong lessons from the war. There's no stab-in-the-back myth — but there is a triumphant Wilhelmine empire convinced that aggressive war works, a crushed France, and a political culture rewarded for everything it believed. Argue that this world — victorious empire, no Weimar, no Versailles, no November criminals — is one where Adolf Schicklgruber has no political grievance to sell and no audience willing to buy it."}, {"id": 20, "phase": 2, "op": "SEALED TRAIN", "variant": "Württemberg · April 1917", "mission": "April 1917. The German High Command is putting Lenin and 30 Bolshevik companions on a sealed train from Zurich to Petrograd, calculating correctly that Lenin will destabilize Russia and force a separate peace. You're a German military escort. Somewhere between Gottmadingen and Stuttgart, you detonate the charge you've been carrying since Zurich. Lenin doesn't reach Petrograd.", "complication": "The revolutionary conditions that produced Lenin don't disappear because he dies in Württemberg. Without him, the Bolsheviks are one faction among several competing for a revolution already in motion. But without the Soviet state, there's no communist specter haunting Weimar politics, no red threat for Munich's beer halls to organize against. Argue the chain from \"Lenin dies on a German train in 1917\" to \"Hitler never enters politics\" — and navigate the uncomfortable question of whether Trotsky just does it instead."}, {"id": 21, "phase": 3, "op": "WRONG MEETING", "variant": "Munich · September 1919", "mission": "September 1919. Captain Mayr needs a Reichswehr informant to attend a meeting of the German Workers' Party — a tiny nationalist splinter group meeting at the Sterneckerbräu beer hall. He picks Subject A. This is the assignment that accidentally launches his political career. You're Mayr's adjutant. You reroute the order. Subject A spends the autumn of 1919 infiltrating KPD reading groups in Schwabing instead. He never walks into the Sterneckerbräu. He never meets Drexler.", "complication": "You're sending a man who viscerally hates communism to infiltrate communists for ninety days on a military assignment he can't refuse. Argue that compulsory proximity to the political enemy produces either genuine doubt or enough delay that the DAP finds someone else and moves on — and explain why a party with 54 members and no money can't simply wait for him to finish the assignment."}, {"id": 22, "phase": 3, "op": "FLUFFY", "variant": "Munich · 1919", "mission": "Hitler genuinely loves animals. He has a documented soft spot for dogs his entire life, will later oppose vivisection with genuine feeling, and will eventually pass Europe's most progressive animal welfare legislation. In 1919 he's a thirty-year-old veteran with no job, no qualifications, and a great deal of energy. You land in Munich with funding for a well-staffed animal welfare organization and a position for someone who can work a crowd. You recruit him. Adolf Hitler becomes the charismatic public face of German animal rights.", "complication": "Animal rights in Weimar Germany isn't politically neutral territory. The movement has its own völkisch wing, its own antisemitic currents around kosher slaughter, its own romantic nationalist streak. You're not moving Subject A away from ideology — you're moving him sideways into adjacent ideology. Argue that Tierschutz absorbs him completely rather than becoming a stepping stone back to the platform your briefing describes."}, {"id": 23, "phase": 3, "op": "LAST ROUND", "variant": "Munich · November 8, 1923", "mission": "November 8, 1923. Hitler fires a pistol at the ceiling of the Bürgerbräukeller and announces the national revolution. He needs three specific men in the hall — State Commissioner Kahr, General Lossow, and Police Chief Seisser — to cooperate. You're the catering manager. Tonight's beer is exceptional. By the time Hitler rises to speak, the three men whose cooperation he requires are in no condition to process a revolution. The putsch dissolves into confused officials and overturned chairs.", "complication": "The putsch fails anyway in real life — what it produces is a trial, a platform, a light sentence, and Mein Kampf. A genuinely farcical failure might close that chapter entirely. Argue that how a putsch fails matters: that a revolution announced to a roomful of incapacitated Bavarian officials cannot be mythologized the way a march suppressed by armed state violence can."}, {"id": 24, "phase": 3, "op": "BASIC ECONOMICS", "variant": "Berlin · 1920–1923", "mission": "Rudolf Havenstein is running the Reichsbank and is about to print Germany into oblivion. By 1923 a wheelbarrow of cash won't buy a loaf of bread. The German middle class loses everything. You arrive in Berlin in 1920 as an economic advisor with access to Havenstein's inner circle. Your message is simple: stop printing money. You have three years and you brought charts.", "complication": "The printing isn't purely stupidity — it's reparations pressure, wartime debt, and a political class that can't agree on alternatives. Argue that hyperinflation specifically — not economic hardship generally — produces the particular political desperation that feeds the NSDAP. Then explain why Havenstein listens to you when his entire institutional framework is pushing in the opposite direction."}, {"id": 25, "phase": 3, "op": "HANGING JUDGE", "variant": "Munich · April 1924", "mission": "April 1924. Hitler is convicted of treason following the Beer Hall Putsch. The sympathetic Munich judges give him five years with immediate parole eligibility — the most lenient reading of a statute that carries a maximum sentence of life imprisonment. You're a federal prosecutor in Berlin with jurisdiction to appeal. You appeal. The case goes before a federal tribunal that didn't fight alongside the defendant at the Feldherrnhalle. The sentence is reconsidered upward. Significantly.", "complication": "A heavy sentence for Hitler in 1924 risks producing a martyr at exactly the moment his movement is still small enough that martyrdom could grow it. Argue that an imprisoned or exiled Subject A closes the NSDAP rather than radicalizing it — that the movement at this stage is dependent enough on his specific person that it doesn't survive him — and then reckon with the fact that Göring, Hess, and Röhm are still very much alive."}, {"id": 26, "phase": 3, "op": "FOLLOW THE MONEY", "variant": "Düsseldorf · 1928", "mission": "Fritz Thyssen opens the doors of German heavy industry to Hitler in the late 1920s — money, contacts, and social legitimacy. You arrive in 1928 as a trusted financial advisor to the Thyssen group carrying documented evidence that associating with the NSDAP creates specific, quantifiable legal and financial liability for Thyssen AG. You make the case in terms Thyssen understands. He doesn't write the check.", "complication": "Thyssen is one of several industrial patrons, and closing his wallet doesn't close the others. Argue that he specifically is the load-bearing donor — that his social position and early commitment make him irreplaceable rather than just first — and that his withdrawal collapses the network rather than just trimming one line from the budget. Then explain why a steel magnate finds your legal risk assessment more persuasive than his own political convictions."}, {"id": 27, "phase": 3, "op": "BAD PRESS", "variant": "Bad Harzburg · October 1931", "mission": "October 1931. Alfred Hugenberg organizes the Harzburg Front rally, deliberately staging it to present Hitler and the German conservative establishment as a unified bloc. The shared platform gives Subject A access to Hugenberg's newspapers, his donors, and his implicit endorsement. You're Hugenberg's chief political advisor. You make the case — on purely strategic grounds — that sharing a stage with Hitler makes Hugenberg look desperate rather than powerful. Subject A is not on the platform.", "complication": "Hitler still has 18% of the electorate. Hugenberg still wants a mass movement. Argue that exclusion from one rally in October 1931 permanently closes the door to conservative money and respectability — rather than just meaning they consummate the same arrangement somewhere else, three months later, over different beer."}, {"id": 28, "phase": 3, "op": "GRANDPA", "variant": "Berlin · Autumn 1932", "mission": "January 1933. Paul von Hindenburg — 85 years old, intermittently senile, being managed by his son Oskar and Franz von Papen — is being steered toward appointing Hitler Chancellor. You're his personal physician in autumn 1932. You file a formal assessment of the President's mental competence with the constitutional authorities, simultaneously copied to three separate offices. A legal process for presidential incapacity is triggered. Hindenburg doesn't make the January 30th appointment because Hindenburg is not legally authorized to make any appointment.", "complication": "His constitutional successor has the legal authority but none of Hindenburg's symbolic weight — and the same conservative coalition is pushing the same agenda at whoever sits in that chair. Argue that removing the manipulable figurehead closes the window rather than just changing who's being manipulated, and that a legitimate successor handles January 1933 better rather than just differently."}, {"id": 29, "phase": 3, "op": "SMOKE ALARM", "variant": "Communist Variant · Berlin, January 1933", "mission": "February 27, 1933. Marinus van der Lubbe — a 24-year-old Dutch radical with communist sympathies and matches — is about to burn down the Reichstag and hand the new government the emergency pretext it needs. You're a KPD district organizer in January 1933. Van der Lubbe is making no secret of his intentions in left-wing circles. You find him three weeks before he finds the building. He spends the next month doing something else.", "complication": "The Reichstag Fire Decree is drafted within hours using Article 48 — the apparatus is ready and waiting for any pretext. Argue that this fire specifically — its timing, its clean communist-culprit narrative, its spectacular visibility — was necessary rather than merely convenient, and that a government prepared for emergency rule still needs exactly the right emergency to make the suspension of civil liberties stick."}, {"id": 30, "phase": 3, "op": "VERSAILLES", "variant": "Paris Peace Conference · June 1919", "mission": "June 1919. The Treaty of Versailles is being finalized. John Maynard Keynes is about to resign in protest over the reparations terms, predicting correctly that they will produce another war within a generation. You arrive as an American economic advisor with access to Woodrow Wilson's inner circle — and a detailed briefing on what these specific terms produce fourteen years later. You make sure Wilson actually reads what Keynes is writing. Reparations are scaled back. The war guilt clause is softened.", "complication": "You're asking the French — who lost a generation of men on their own soil — to be reasonable about punishing the aggressor. \"Squeeze Germany until the pips squeak\" is not just Clemenceau's position, it's his electorate's. Argue that a less punitive peace produces a stable Weimar Republic rather than an emboldened Germany, that Wilson has the leverage to bring Clemenceau along, and that the deal doesn't die in the U.S. Senate before the ink dries."}, {"id": 31, "phase": 4, "op": "BAD WIESSEE", "variant": "Bavaria · June 30, 1934", "mission": "June 1934. Hitler is about to purge Ernst Röhm and the SA leadership before they can purge him. Röhm is at a hotel in Bad Wiessee, about to be arrested in his pajamas. You get there first. You tell Röhm exactly what's coming, exactly when, and exactly who signed the order. He has 36 hours, the loyalty of three million SA men, and nothing left to lose.", "complication": "Röhm wants a revolutionary army, not a parliamentary state. A surviving Röhm doesn't produce democracy — it produces a different catastrophe, with the SS and SA destroying each other while the Wehrmacht watches and calculates. Argue that a regime crisis in July 1934 is preferable to the alternative, and that the chaos you're starting is more survivable than the consolidation you're preventing."}, {"id": 32, "phase": 4, "op": "BRIEFCASE", "variant": "Wolf's Lair · July 20, 1944", "mission": "July 20, 1944. Stauffenberg places a briefcase bomb under the Wolf's Lair conference table and leaves to catch his plane. A helpful officer moves the briefcase because it's in the way. Hitler survives. You're Stauffenberg's aide. Both bombs go in the case. The case goes against the heavy table support. You get on the plane. You wait.", "complication": "Valkyrie's political plan is a conservative military coup — the plotters want a separate peace with the West, excluding the Soviets. They are not democrats. Argue that a successful July 20th with these specific men in power is still better than the actual outcome — keeping in mind that the Holocaust is running at full capacity during every month this war continues."}, {"id": 33, "phase": 4, "op": "CARPENTER", "variant": "Munich · November 8, 1939", "mission": "November 8, 1939. Georg Elser — a 36-year-old cabinet maker with communist sympathies — has spent 35 nights hiding in the Bürgerbräukeller after closing time, carving a cavity into a pillar behind the podium and building a timing device from scratch. He plants it perfectly. Hitler leaves 13 minutes early. Eight people die. Hitler is not one of them. You are not Georg Elser. You are the person who has to convince him to set the timer 13 minutes earlier.", "complication": "One working-class man with hand tools comes closer than the entire Wehrmacht officer corps ever will. The mission is almost insultingly simple — it's a timer. But Elser has been working alone in secret for months, trusts no one, and has no reason whatsoever to believe a stranger who claims to know the future. You cannot replace him. You can only persuade him. Account for how you do that — and for the possibility that Hitler's schedule changes for an entirely different reason on an entirely different night."}, {"id": 34, "phase": 4, "op": "HALDER", "variant": "Berlin & London · September 1938", "mission": "September 1938. General Franz Halder has a documented coup plan ready to activate the moment Hitler orders war over Czechoslovakia. Then Chamberlain flies to Munich and gives Hitler the Sudetenland for free — killing the trigger Halder needs. Your mission is two-fold: stiffen Halder's spine so the coup happens regardless, and get a message to Chamberlain before he boards the plane explaining what his goodwill is about to destroy. One man needs a backbone. The other needs information. You have 72 hours.", "complication": "Halder spends the entire war drafting coup plans he never executes. Chamberlain thinks he's saving millions of lives and may not bet British foreign policy on an anonymous tip about a German general's nerve. Argue that you can move both men simultaneously — that Halder actually follows through, and that a German military government in October 1938 is better than what follows, even though the men running it are also not democrats."}, {"id": 35, "phase": 4, "op": "JESSE", "variant": "Berlin Olympics · August 1936", "mission": "Berlin Olympics, August 1936. Jesse Owens has just won four gold medals in front of 100,000 people and Adolf Hitler. Hitler is in the stands. You have been sent back not to replace Jesse Owens but to brief him — to sit across from the greatest athlete on earth and tell him what you know, what is coming, and what the eyes of the world are currently pointed at. What he does with that information is his choice. The victory lap takes him within twenty meters of the Führer's box. He has already said yes.", "complication": "There are 100,000 witnesses, several hundred press photographers, and every foreign diplomat in Germany present. Whatever happens, happens on film, at the most watched sporting event in the world, at the precise moment Germany is trying to show the world a civilized face. Argue that a public act in this specific place strips Germany of its international credibility at its own showcase moment, in ways that matter. Then sit with the fact that you're asking Jesse Owens to make that calculation himself, about his own life, on your behalf."}, {"id": 36, "phase": 4, "op": "WANNSEE", "variant": "Berlin · January 20, 1942", "mission": "January 20, 1942. Fifteen senior Nazi officials are meeting at a lakeside villa in Wannsee to coordinate the administrative machinery of the Final Solution across every government department. Reinhard Heydrich is chairing it. You've had since 1939 to prepare. You know the address, the guest list, and the ninety-minute window when all fifteen are in one room. This is the most target-rich environment in the history of the Third Reich.", "complication": "The murder is already happening before Wannsee — the Einsatzgruppen have killed over half a million people before this meeting. Wannsee doesn't start the genocide, it industrializes it. The fifteen men in that room, while irreplaceable in their specific roles, are not the only people in a government of millions capable of coordinating what they're there to systematize. Argue that removing the administrative leadership at the moment of industrialization disrupts the operation rather than simply promoting its second tier."}, {"id": 37, "phase": 4, "op": "BALLOT BOX", "variant": "Vienna · February 1938", "mission": "February 1938. Austrian Chancellor Schuschnigg is planning a referendum on Austrian independence but hasn't locked in the date — he's being cautious, which means he's giving Berlin time to react. You arrive in Vienna as his political advisor with one piece of advice: move it up. Announce it loudly, internationally, immediately. Get international observers on planes before Germany can mobilize a response. The vote happens in February, not March. The world is watching before Hitler can act.", "complication": "A rushed referendum produces a rushed campaign, and Austrian support for union with Germany is genuinely significant — polls suggest it might pass even in a free vote. A narrow yes is still different from tanks rolling across the border. A narrow no leaves Hitler having lost a public vote to a small alpine country he then invades anyway, in front of observers he personally invited. Argue that speed creates a political fact that changes the international response — even if it doesn't change the outcome on the ground."}, {"id": 38, "phase": 4, "op": "STAY HOME", "variant": "Paris · 1930", "mission": "France spends the 1930s building the Maginot Line — the most expensive, most elaborate underground fortification in history — along the Franco-German border. Germany goes around it in four days through the Ardennes. You are a French military budget committee member in 1930. You make the simple, obvious, career-ending argument that the money would be better spent on tanks and mobile divisions. The Maginot Line is not built. France has a modern army instead.", "complication": "Here's the thing: the Maginot Line worked exactly as intended. It forced Germany to attack through Belgium, where the mobile French army was supposed to meet them. The problem wasn't the bunkers — it was that your shiny new mobile army drove into Belgium and got flanked at Sedan anyway. Argue that the issue was doctrine, not concrete, and that a France without the Line but with the same generals and the same strategic assumptions doesn't actually fight a different war."}, {"id": 39, "phase": 4, "op": "SAAR", "variant": "Franco-German Border · September 1939", "mission": "September 1939. Germany invades Poland. France has 85 divisions on the German border. Germany has 23. The window is real and it will not stay open — every day Poland holds is a day France could be advancing. You're a French staff officer with the ear of General Gamelin. You make the case for a full Saar offensive, right now, before a single German division can be moved west. France has a three-to-one advantage and Germany's western defenses are a skeleton.", "complication": "Gamelin is the man who will lose France in six weeks, which tells you something about his appetite for bold offensive action. And here's the harder question: even if France pushes through the Saar in September 1939, then what? Argue the full chain — a successful offensive produces X, which forces Y, which prevents Z — and account for the fact that you're betting everything on a general who will spend the next eight months doing nothing."}, {"id": 40, "phase": 4, "op": "GÖTTERDÄMMERUNG", "variant": "The Führerbunker · April 30, 1945", "meta": true, "mission": "April 30, 1945. Hitler is about to shoot himself in the Führerbunker. Eva Braun has already taken cyanide. The Red Army is two miles away. Your mission — your only mission — is to make sure nothing goes wrong. No dramatic last-minute interventions. No captures. No trials. No martyrdom. History ends exactly as it actually ended: a dead man, a shallow grave, a can of petrol. You are not here to change anything. You are here to make sure none of your colleagues did.", "complication": "You have just sat through three rounds of your fellow agents arguing that they could fix everything with a midwife, a timer, a persuasive chart about monetary policy, or Jesse Owens. You have been sent back to the worst place in history to preserve the outcome. Argue that the timeline we actually got — flawed, incomplete, morally horrifying in its own ways — is preferable to any of the alternatives proposed tonight. Argue that messing with history is always a bad idea. Argue that the machine should never have been built. Then explain why you got on it anyway."}]};
const CARDS = DATA.cards;

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function buildCard(card, idx) {
  const num = String(idx + 1).padStart(2, '0');
  return `
  <div class="card phase-${card.phase}">
    <div class="card-inner">
      <div class="card-header">
        <div class="card-org">Temporal Intelligence Directorate</div>
        <div class="card-division">Field Operations Division — Mission Dossier</div>
      </div>
      <div class="card-op-block">
        <div class="card-op-label">Operation</div>
        <span class="card-op-name">${esc(card.op)}</span>
        <div class="card-op-variant">${esc(card.variant)}</div>
        <span class="card-phase-badge">${esc(PHASES[card.phase].label)}</span>
      </div>
      <div class="card-body">
        <div><div class="section-label">Mission</div><div class="section-text">${esc(card.mission)}</div></div>
        <div class="complication-block"><div class="section-label">Complication</div><div class="section-text">${esc(card.complication)}</div></div>
      </div>
      <div class="card-footer">
        <div class="card-footer-text">Series Γ &nbsp;·&nbsp; Card ${num} of ${CARDS.length} &nbsp;·&nbsp; For Authorized Eyes Only</div>
      </div>
    </div>
  </div>`;
}
function buildDeck() {
  let html = '';
  for (let i = 0; i < CARDS.length; i += 4) {
    const batch = CARDS.slice(i, i + 4);
    html += `<div class="page-label no-print">Page ${Math.floor(i/4)+1} / ${Math.ceil(CARDS.length/4)} — Phase ${batch[0].phase}: ${esc(PHASES[batch[0].phase].name)}</div><div class="page">`;
    batch.forEach((c, j) => { html += buildCard(c, i + j); });
    html += `</div>`;
  }
  document.getElementById('deck').innerHTML = html;
}
